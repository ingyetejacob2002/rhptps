version: "3.9"

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: rhptps
      POSTGRES_USER: rhptps
      POSTGRES_PASSWORD: rhptps_dev_password
    volumes:
      - rhptps_pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rhptps"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://rhptps:rhptps_dev_password@db:5432/rhptps
      SECRET_KEY: change-me-in-production
      JWT_SECRET_KEY: change-me-in-production
    ports:
      - "5000:5000"
    command: >
      sh -c "python -c 'from app import create_app; from app.extensions import db; app=create_app(); app.app_context().push(); db.create_all()' &&
             gunicorn -b 0.0.0.0:5000 -w 2 run:app"

volumes:
  rhptps_pg_data:
